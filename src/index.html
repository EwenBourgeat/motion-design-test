<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'Intendant — Meta Ad 20s</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <!-- ============ S1 · HOOK — la charge mentale ============ -->
  <section class="scene" id="s1">
    <div class="cam" id="s1cam">
      <div id="cards"></div>
      <div id="s1head">
        <div class="mask"><div class="t-serif split" id="s1a">Propriétaire</div></div>
        <div class="mask"><div class="t-caps split" id="s1b">à Toulouse&nbsp;?</div></div>
      </div>
    </div>
  </section>

  <!-- ============ S2 · RELIEF — on s'occupe de tout ============ -->
  <section class="scene" id="s2">
    <div class="cam" id="s2cam">
      <div class="mask" id="s2occ-m"><div class="t-caps split" id="s2occ">On s'occupe</div></div>
      <div id="cyc"></div>
      <div id="s2rule"></div>
      <div class="mask" id="s2perc-m">
        <div id="s2hl"></div>
        <div class="t-caps split" id="s2perc">Vous percevez.</div>
      </div>
    </div>
  </section>

  <!-- ============ S3 · PREUVES — les chiffres ============ -->
  <section class="scene" id="s3">
    <div class="cam" id="s3cam">
      <div id="num"></div>
      <div id="caps3"></div>
      <div id="viz"></div>
    </div>
  </section>

  <!-- ============ S4 · LOCAL — Toulouse ============ -->
  <section class="scene" id="s4">
    <div id="wall"></div>
    <div class="cam" id="s4cam">
      <div id="s4fg">
        <div class="mask"><div class="t-caps split" id="s4a">Une équipe</div></div>
        <div class="mask"><div class="t-serif split" id="s4b">toulousaine.</div></div>
        <div id="gbadge">
          <span class="g-score">5,0</span>
          <span class="g-stars"></span>
          <span class="g-lbl">Google</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ S5 · OFFRE + CTA ============ -->
  <section class="scene" id="s5">
    <div class="cam" id="s5cam">
      <div id="logo">
        <img class="ll" src="logo-wordmark.png" alt="">
        <img class="ll" src="logo-wordmark.png" alt="">
        <img class="ll" src="logo-wordmark.png" alt="">
      </div>
      <div class="mask" id="est-m"><div class="t-caps split" id="est">Estimation</div></div>
      <div class="mask" id="grat-m"><div class="t-serif split" id="grat">gratuite</div></div>
      <div id="h48row">
        <div class="mask"><div class="t-caps split" id="sous">sous</div></div>
        <div id="h48box"><div class="mask"><div class="t-caps split" id="h48">48&nbsp;h.</div></div></div>
      </div>
      <div id="btn">
        <div id="btnring"></div>
        <span id="btntxt">Estimer mon bien</span>
        <span id="btnarr"><svg viewBox="0 0 48 48"><path d="M12 24h24M26 13l11 11-11 11" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div id="phone">06 21 93 44 13</div>
    </div>
  </section>

  <!-- transition layers -->
  <div class="wipe" id="w12"></div>
  <div class="wipe" id="w23a"></div>
  <div class="wipe" id="w23b"></div>
  <div class="wipe" id="w34"></div>
  <div class="wipe" id="w45"></div>

  <div id="grain"></div>
  <div id="vignette"></div>
</div>

<script src="main.js"></script>
</body>
</html>
